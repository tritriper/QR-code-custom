name: Déploiement de l'app web sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; si deux pushs se suivent, seul le dernier
# compte. `cancel-in-progress` n'annule pas un déploiement déjà commencé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/qrcodegen est un submodule : sans lui, `npm run vendor`
          # produit un fichier vide et le build échoue.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le hook `prepare` de npm lance `npm run vendor` au passage.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
